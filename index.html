<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071019">

<script>
(() => {
  const stop = e => e.preventDefault();
  document.addEventListener('gesturestart', stop, {passive:false});
  document.addEventListener('gesturechange', stop, {passive:false});
  document.addEventListener('gestureend', stop, {passive:false});
  document.addEventListener('dblclick', stop, {passive:false});
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 340) e.preventDefault();
    lastEnd = now;
  }, {passive:false});

  const lockViewport = () => {
    const meta = document.querySelector('meta[name="viewport"]');
    if (meta) meta.setAttribute('content',
      'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');
    window.scrollTo(0,0);
  };
  window.addEventListener('pageshow', lockViewport);
  window.addEventListener('orientationchange', lockViewport);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', lockViewport);
    visualViewport.addEventListener('scroll', () => window.scrollTo(0,0));
  }
})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">

  </div>
 </div>

<script type="module" src="game.js"></script>
<script>
(() => {
  let registration = null;
  const btn = () => document.getElementById('updateBtn');

  function markUpdateReady(){
    const b=btn(); if(!b)return;
    b.classList.add('updateReady');
    b.textContent='⬆';
    b.title='Nouvelle version disponible';
  }

  async function checkUpdate(forceReload=false){
    const b=btn();
    try{
      if(b){b.classList.add('checking');b.textContent='…'}
      if(!('serviceWorker' in navigator)){ if(forceReload)location.reload(); return; }
      registration = registration || await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      await registration.update();

      if(registration.waiting){
        registration.waiting.postMessage({type:'SKIP_WAITING'});
        return;
      }

      const installing=registration.installing;
      if(installing){
        installing.addEventListener('statechange',()=>{
          if(installing.state==='installed'){
            if(navigator.serviceWorker.controller) markUpdateReady();
            else location.reload();
          }
        });
      }else if(forceReload){
        location.reload();
      }else{
        const b2=btn(); if(b2){b2.classList.remove('checking');b2.textContent='↻'}
      }
    }catch(e){
      const b2=btn(); if(b2){b2.classList.remove('checking');b2.textContent='↻'}
    }
  }

  window.streetQuestUpdate=()=>checkUpdate(true);

  addEventListener('load',async()=>{
    if(!('serviceWorker' in navigator))return;
    registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>null);
    if(!registration)return;
    if(registration.waiting)markUpdateReady();
    registration.addEventListener('updatefound',()=>{
      const w=registration.installing;
      if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)markUpdateReady()});
    });
    setTimeout(()=>checkUpdate(false),1200);
    setInterval(()=>checkUpdate(false),60000);
  });

  navigator.serviceWorker?.addEventListener('controllerchange',()=>{
    if(sessionStorage.getItem('sq-reloading'))return;
    sessionStorage.setItem('sq-reloading','1');
    location.reload();
  });

  addEventListener('pageshow',()=>sessionStorage.removeItem('sq-reloading'));
})();
</script>
</body>
