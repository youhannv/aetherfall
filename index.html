<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071019">

<script>
(() => {
  const stop = e => e.preventDefault();
  document.addEventListener('gesturestart', stop, {passive:false});
  document.addEventListener('gesturechange', stop, {passive:false});
  document.addEventListener('gestureend', stop, {passive:false});
  document.addEventListener('dblclick', stop, {passive:false});
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 340) e.preventDefault();
    lastEnd = now;
  }, {passive:false});

  const lockViewport = () => {
    const meta = document.querySelector('meta[name="viewport"]');
    if (meta) meta.setAttribute('content',
      'width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');
    window.scrollTo(0,0);
  };
  window.addEventListener('pageshow', lockViewport);
  window.addEventListener('orientationchange', lockViewport);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', lockViewport);
    visualViewport.addEventListener('scroll', () => window.scrollTo(0,0));
  }
})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreetQuest 3D V9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>StreetQuest 3D V9</title>
</head>
<body>
<div id="app">
 <div id="viewport">
  <div id="threeHost"></div>
  <header class="topHud">
   <div class="brand"><b>STREETQUEST 3D</b><small id="district">PARIS • CENTRE</small></div>
   <button id="menuBtn" class="roundBtn">☰</button>
  </header>

  <div class="stats">
   <span>❤️ <b id="hp">100</b></span>
   <span>🛡️ <b id="armor">0</b></span>
   <span>🪙 <b id="coins">100</b></span>
   <span>⭐ <b id="level">1</b></span>
   <span>🚨 <b id="wanted">0</b></span>
  </div>

  <div class="mapWrap"><canvas id="minimap" width="200" height="200"></canvas><button id="mapExpandBtn" class="mapExpandBtn">🗺️</button></div>

  <div class="missionCard">
   <small>AVENTURE</small>
   <b id="missionTitle">Chargement…</b>
   <span id="missionText"></span>
  </div>

  <div id="weatherChip" class="weatherChip">☀️ JOUR</div>

  <div id="targetCard" class="targetCard hidden">
   <div class="targetHead">
    <small>CIBLE SÉLECTIONNÉE</small>
    <button id="clearTarget" class="targetClose">✕</button>
   </div>
   <b id="targetName">Passant</b>
   <span id="targetInfo">Suis cette personne discrètement.</span>
   <div class="suspicion"><i id="suspicionBar"></i></div>
   <div class="targetFooter"><span id="targetDistance">— m</span><span id="targetLoot">🪙 ?</span></div>
  </div>


  <div id="dialogue" class="dialogue hidden">
   <div class="portrait" id="dialogueIcon">🙂</div>
   <div class="dialogueMain"><b id="dialogueName"></b><p id="dialogueText"></p></div>
   <button id="dialogueNext" class="smallBtn">Suite</button>
  </div>
  <div id="prompt" class="prompt hidden">
   <div><b id="promptTitle"></b><small id="promptText"></small></div>
   <button id="promptBtn" class="promptBtn">INTERAGIR</button>
  </div>

  <div id="combat" class="combat hidden">
   <div class="combatHead"><b id="enemyName"></b><span id="enemyLvl"></span></div>
   <div class="hpbar"><i id="enemyBar"></i></div>
   <div class="combatBtns"><button id="attackBtn" class="dangerBtn">⚔️ ATTAQUER</button><button id="fleeBtn" class="normalBtn">🏃 FUIR</button></div>
  </div>

  <div class="controls">
   <div class="joyWrap"><small>MARCHER</small><div class="joystick" id="moveJoy"><div class="knob" id="moveKnob"></div></div></div>
   <div class="centerActions"><button id="scanBtn" class="actionCircle">📡</button><button id="interactBtn" class="actionCircle large">✋</button></div>
   <div class="joyWrap"><small>REGARDER</small><div class="joystick" id="lookJoy"><div class="knob" id="lookKnob"></div></div></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="mapOverlay" class="mapOverlay hidden">
   <div class="mapOverlayBox">
    <div class="sheetHead"><h2>Grande mini-carte</h2><button id="closeMapOverlay" class="roundBtn">✕</button></div>
    <canvas id="bigMinimap" width="640" height="640"></canvas>
    <p class="sub" style="margin-top:10px">Astuce PC : clic dans le jeu pour activer la souris, M pour ouvrir cette carte, E pour interagir.</p>
   </div>
  </div>

 </div>

 <nav class="bottomNav">
  <button data-panel="world" class="nav active">🌍<small>Monde</small></button>
  <button data-panel="bag" class="nav">🎒<small>Sac</small></button>
  <button data-panel="home" class="nav">🏠<small>Base</small></button>
  <button data-panel="quests" class="nav">📜<small>Quêtes</small></button>
  <button data-panel="districts" class="nav">🏙️<small>Quartiers</small></button>
  <button data-panel="settings" class="nav">⚙️<small>Réglages</small></button>
 </nav>

 <div id="sheet" class="sheet hidden">
  <div class="sheetBox">
   <div class="handle"></div>
   <div class="sheetHead"><h2 id="sheetTitle"></h2><button id="closeSheet" class="roundBtn">✕</button></div>
   <div id="sheetBody"></div>
  </div>
 </div>
</div>
<script type="module" src="game.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
